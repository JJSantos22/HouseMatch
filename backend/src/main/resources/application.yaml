spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: housematch
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${SUPABASE_DB_HOST:localhost}:5432/postgres?user=${SUPABASE_DB_USER:postgres}&password=${SUPABASE_DB_PASSWORD:password}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:password}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
